<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, .86);
      --surface-solid: #fff;
      --ink: #19243d;
      --muted: #66728c;
      --line: #e5eaf3;
      --accent: #6b5cff;
      --accent-dark: #5142dd;
      --accent-soft: #efedff;
      --green: #159a67;
      --green-soft: #e4f8ef;
      --red: #dd5266;
      --red-soft: #fff0f2;
      --shadow: 0 22px 70px rgba(47, 57, 92, .14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #101525;
        --surface: rgba(27, 35, 59, .88);
        --surface-solid: #1b233b;
        --ink: #f3f5ff;
        --muted: #a8b1ca;
        --line: #303a58;
        --accent: #988dff;
        --accent-dark: #b3abff;
        --accent-soft: #2c2952;
        --green: #53d59b;
        --green-soft: #1d4439;
        --red: #ff7d8f;
        --red-soft: #492934;
        --shadow: 0 22px 70px rgba(0, 0, 0, .3);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 15% 12%, rgba(117, 105, 255, .16), transparent 27rem),
        radial-gradient(circle at 92% 85%, rgba(55, 194, 164, .13), transparent 26rem),
        var(--bg);
      color: var(--ink);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { width: min(100%, 548px); }

    .quiz-card {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .quiz-card::before {
      position: absolute;
      top: -92px;
      right: -60px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(107, 92, 255, .19), rgba(57, 203, 169, .05));
      content: "";
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow::before { content: "✦"; font-size: 16px; }

    h1, h2, p { margin-top: 0; }
    h1 { max-width: 350px; margin-bottom: 8px; font-size: clamp(28px, 6vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
    h2 { margin-bottom: 24px; font-size: clamp(20px, 4vw, 26px); line-height: 1.22; letter-spacing: -.025em; }
    .intro { max-width: 390px; margin-bottom: 30px; color: var(--muted); }

    .topline, .meta, .result-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .topline { margin-bottom: 10px; }
    .counter { color: var(--muted); font-size: 13px; font-weight: 700; }
    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }
    .score::before { content: "★"; }

    .progress-track { height: 8px; margin-bottom: 34px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .progress-fill { width: 10%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #36cba9); transition: width .45s cubic-bezier(.22, 1, .36, 1); }

    .answers { display: grid; gap: 11px; }
    .answer {
      position: relative;
      display: flex;
      width: 100%;
      align-items: center;
      gap: 13px;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-solid);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
    }
    .answer:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(107, 92, 255, .1); }
    .answer:focus-visible, .button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 3px; }
    .answer:disabled { cursor: default; }
    .answer.selected {
      border-width: 2px;
      padding: 13px 14px;
      background:
        linear-gradient(105deg, color-mix(in srgb, var(--accent-soft) 78%, transparent), transparent 72%),
        repeating-linear-gradient(0deg, transparent 0 5px, color-mix(in srgb, var(--accent) 5%, transparent) 5px 6px),
        var(--surface-solid);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent), 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent), 0 10px 22px color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      letter-spacing: .01em;
    }
    .answer.selected::after {
      position: absolute;
      top: 7px;
      right: 12px;
      color: var(--accent);
      content: "LOCKED";
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .12em;
    }
    .answer.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .answer.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); animation: shake .42s ease both; }
    .answer.selected.correct {
      background:
        linear-gradient(105deg, color-mix(in srgb, var(--green-soft) 86%, transparent), transparent 72%),
        repeating-linear-gradient(0deg, transparent 0 5px, color-mix(in srgb, var(--green) 6%, transparent) 5px 6px),
        var(--surface-solid);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 30%, transparent), 0 0 0 3px color-mix(in srgb, var(--green) 12%, transparent), 0 10px 22px color-mix(in srgb, var(--green) 14%, transparent);
    }
    .answer.selected.wrong {
      background:
        linear-gradient(105deg, color-mix(in srgb, var(--red-soft) 86%, transparent), transparent 72%),
        repeating-linear-gradient(0deg, transparent 0 5px, color-mix(in srgb, var(--red) 6%, transparent) 5px 6px),
        var(--surface-solid);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 30%, transparent), 0 0 0 3px color-mix(in srgb, var(--red) 12%, transparent), 0 10px 22px color-mix(in srgb, var(--red) 14%, transparent);
    }
    .answer-icon { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 800; }
    .answer.correct .answer-icon { background: var(--green); color: #fff; }
    .answer.wrong .answer-icon { background: var(--red); color: #fff; }

    .feedback { min-height: 25px; margin: 17px 0 0; font-size: 13px; font-weight: 700; }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(107, 92, 255, .22);
      transition: background .2s, transform .2s;
    }
    .button:hover { background: var(--accent-dark); transform: translateY(-2px); }
    .button.secondary { background: var(--accent-soft); color: var(--accent); box-shadow: none; }

    .results { text-align: center; }
    .result-emoji { display: block; margin: 8px 0 17px; font-size: 68px; line-height: 1; animation: float 2.8s ease-in-out infinite; }
    .result-heading { justify-content: center; margin-bottom: 8px; }
    .result-score { margin-bottom: 26px; color: var(--muted); }
    .result-score strong { color: var(--ink); font-size: 25px; }
    .result-message { max-width: 370px; margin: 0 auto 28px; color: var(--muted); }
    .hidden { display: none; }

    @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
    @keyframes float { 50% { transform: translateY(-8px) rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="quiz-card" aria-live="polite">
      <div id="quiz-view">
        <p class="eyebrow">Orbit quiz</p>
        <div class="topline">
          <span class="counter" id="counter">Question 1 of 10</span>
          <span class="score" id="score">0 pts</span>
        </div>
        <div class="progress-track" aria-label="Quiz progress"><div class="progress-fill" id="progress"></div></div>
        <h1 id="question">Loading the cosmos…</h1>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" role="status"></p>
      </div>

      <div class="results hidden" id="results">
        <p class="eyebrow">Mission complete</p>
        <span class="result-emoji" id="result-emoji" aria-hidden="true">🚀</span>
        <h2 id="result-title">Stellar work!</h2>
        <p class="result-score">You scored <strong id="final-score">0 / 10</strong></p>
        <p class="result-message" id="result-message"></p>
        <button class="button" id="restart" type="button">Play again</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1, fact: "Mars gets its rusty color from iron minerals in its soil." },
      { question: "What is the name of our galaxy?", options: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], answer: 2, fact: "The Milky Way is a barred spiral galaxy, home to our Solar System." },
      { question: "Which is the largest planet in our Solar System?", options: ["Saturn", "Neptune", "Earth", "Jupiter"], answer: 3, fact: "Jupiter is so large that more than 1,300 Earths could fit inside it." },
      { question: "What force keeps planets in orbit around the Sun?", options: ["Magnetism", "Gravity", "Friction", "Solar wind"], answer: 1, fact: "Gravity bends the paths of planets into stable orbits." },
      { question: "Which object is at the center of our Solar System?", options: ["The Moon", "Earth", "The Sun", "Polaris"], answer: 2, fact: "The Sun contains about 99.8% of the Solar System's total mass." },
      { question: "What is a light-year a measurement of?", options: ["Time", "Brightness", "Distance", "Weight"], answer: 2, fact: "A light-year is the distance light travels in one year: about 9.46 trillion km." },
      { question: "Which planet has the most prominent ring system?", options: ["Saturn", "Uranus", "Mars", "Earth"], answer: 0, fact: "Saturn's rings are made mostly of ice, rock, and dust particles." },
      { question: "What was the first human-made object to reach space?", options: ["Sputnik 1", "V-2 rocket", "Apollo 11", "Hubble"], answer: 1, fact: "A German V-2 rocket crossed the Kármán line in 1944." },
      { question: "Which moon is the largest in the Solar System?", options: ["Titan", "Europa", "Ganymede", "The Moon"], answer: 2, fact: "Jupiter's Ganymede is even larger than the planet Mercury." },
      { question: "What do we call a rocky body that enters Earth's atmosphere?", options: ["Asteroid", "Meteor", "Comet", "Quasar"], answer: 1, fact: "The flash of light from a space rock burning in our atmosphere is a meteor." }
    ];

    let current = 0;
    let score = 0;
    let locked = false;
    const $ = (id) => document.getElementById(id);
    const letters = ["A", "B", "C", "D"];

    function renderQuestion() {
      const item = questions[current];
      locked = false;
      $("counter").textContent = `Question ${current + 1} of ${questions.length}`;
      $("score").textContent = `${score} ${score === 1 ? "pt" : "pts"}`;
      $("progress").style.width = `${((current + 1) / questions.length) * 100}%`;
      $("question").textContent = item.question;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("answers").innerHTML = item.options.map((option, index) =>
        `<button class="answer" type="button" data-index="${index}" aria-pressed="false"><span class="answer-icon">${letters[index]}</span><span>${option}</span></button>`
      ).join("");
      document.querySelectorAll(".answer").forEach(button => button.addEventListener("click", () => chooseAnswer(button)));
    }

    function chooseAnswer(button) {
      if (locked) return;
      locked = true;
      const choice = Number(button.dataset.index);
      const item = questions[current];
      const correct = choice === item.answer;
      document.querySelectorAll(".answer").forEach(answer => answer.disabled = true);
      button.classList.add("selected", correct ? "correct" : "wrong");
      button.setAttribute("aria-pressed", "true");
      if (!correct) document.querySelector(`[data-index="${item.answer}"]`).classList.add("correct");
      if (correct) {
        score++;
        $("score").textContent = `${score} ${score === 1 ? "pt" : "pts"}`;
        $("feedback").textContent = `Correct! ${item.fact}`;
        $("feedback").className = "feedback good";
      } else {
        $("feedback").textContent = `Not quite — ${item.fact}`;
        $("feedback").className = "feedback bad";
      }
      setTimeout(() => {
        current++;
        current < questions.length ? renderQuestion() : showResults();
      }, 1250);
    }

    function showResults() {
      $("quiz-view").classList.add("hidden");
      $("results").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;
      const outcome = score === 10 ? ["🌟", "Cosmic genius!", "Perfect orbit. You clearly know your way around the universe."] :
        score >= 7 ? ["🚀", "Stellar work!", "Your space knowledge is ready for launch."] :
        score >= 4 ? ["🪐", "Nice journey!", "You found some great cosmic facts. Keep exploring the stars."] :
        ["🌙", "Keep exploring!", "Every mission starts with curiosity. The universe is waiting for your next try."];
      $("result-emoji").textContent = outcome[0];
      $("result-title").textContent = outcome[1];
      $("result-message").textContent = outcome[2];
    }

    $("restart").addEventListener("click", () => {
      current = 0;
      score = 0;
      $("results").classList.add("hidden");
      $("quiz-view").classList.remove("hidden");
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
